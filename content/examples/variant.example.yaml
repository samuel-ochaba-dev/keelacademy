id: meridian@v3
generator:
  script: generators/meridian_v3.py
parameters:
  - name: claim_count
    range: { min: 120, max: 400 }
    description: "number of claim notes in the corpus"
  - name: policy_clause_set
    range: { values: ["standard", "expanded", "adversarial"] }
seed_rule:
  per_student: hash(student_id, unit_id)
