id: rubric-0.1
version: 1
pass_rule: all
judge:
  prompt: prompts/judge-0.1.md
  model_tier: mid
golden_set: golden/0.1/
criteria:
  - id: zero-jargon
    description: >-
      The submission describes OmniSupply's operational intake and triage challenges
      purely in business and operational domain terms, with zero occurrences of
      artificial intelligence, LLM, agent, machine learning, or related technology buzzwords.
    evidence: >-
      Quote the problem statement and operational requirements to confirm zero
      buzzword occurrences, or quote the specific offending buzzwords.
  - id: root-cause-scale
    description: >-
      The submission defines OmniSupply's root operational problem in exactly 2 to 3
      sentences, explicitly stating the monthly volume (~4,000 transactions, invoices, or
      disputes), multi-artifact friction across disparate inputs (e.g. scanned PDFs, packing
      slips, delivery photos, emails, tickets), and business impact (2 to 3 day triage latency
      and financial leakage from unrecovered credits or billing errors).
    evidence: >-
      Quote the 2 to 3 sentences defining the root problem, showing volume (~4k/mo),
      multi-artifact friction, and both cycle time and financial leakage.
  - id: stakeholder-trilemma
    description: >-
      The submission formulates three distinct, quantified KPIs covering the competing
      priorities of Operations (throughput, processing volume, or triage speed),
      Compliance (audit provenance, audit trail completeness, or 100% verification against
      supplier contract and SLA clauses), and the CFO (financial leakage prevention, dispute
      dollar recovery, or transaction unit cost).
    evidence: >-
      Quote the distinct, quantified KPI statements for Operations, Compliance, and CFO.
  - id: hitl-thresholds
    description: >-
      The submission specifies at least 3 concrete, quantitative boundary rules (human-in-the-loop
      thresholds) that halt automated processing and route transactions to human operations
      specialists for manual review (such as dispute dollar limits, line-item price variance caps,
      confidence score floors, or supplier dispute frequency spikes).
    evidence: >-
      Quote the at least 3 quantitative boundary rules halting automation for human review.
